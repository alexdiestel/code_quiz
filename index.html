<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code_Quest — In space no one can hear you print()</title>

  <!-- SEO -->
  <meta name="description" content="Sharpen your coding instincts. Predict the output of real Python and C++ snippets. A quiz game for developers who think they know their language.">
  <link rel="canonical" href="https://code-quest.dev/">
  <meta name="theme-color" content="#7c3aed">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://code-quest.dev/">
  <meta property="og:title"       content="Code_Quest — In space no one can hear you print()">
  <meta property="og:description" content="Sharpen your coding instincts. Predict the output of real Python and C++ snippets. A quiz game for developers who think they know their language.">
  <meta property="og:image"       content="https://code-quest.dev/og-image.png">

  <!-- Twitter -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Code_Quest — In space no one can hear you print()">
  <meta name="twitter:description" content="Predict the output of real code snippets. Python, C++, and more.">
  <meta name="twitter:image"       content="https://code-quest.dev/og-image.png">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Code_Quest",
    "url": "https://code-quest.dev",
    "description": "A quiz game where you predict the output of real Python and C++ code snippets.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- Cloudflare Web Analytics injected automatically via "Enable globally" in dashboard -->
</head>
<body>

  <div class="bg-glow"></div>

  <!-- ── Header (hidden until a language is chosen) ───────────────────────── -->
  <header class="site-header header-hidden" id="site-header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">{<span class="logo-icon-letters">CQ</span>}</div>
        <div class="logo-text">
          <span class="logo-title">Code<span class="logo-u">_</span>Quest</span>
          <span class="logo-sub" id="logo-sub">Python</span>
        </div>
      </div>
      <div class="score-display hidden" id="score-display">
        <span class="score-pts" id="score-pts">0</span>
        <span class="score-label">pts</span>
      </div>
    </div>
  </header>

  <!-- ── Landing ──────────────────────────────────────────────────────────── -->
  <div id="landing-view">
    <div id="hero-content">

      <h1 id="hero-logo">Code<span class="hero-u">_</span>Quest</h1>

      <p id="hero-sub">In space no one can hear you print()</p>

      <div id="lang-buttons">
        <button class="lang-btn" id="python-btn" data-lang="python">Python</button>
        <button class="lang-btn" id="cpp-btn"    data-lang="cpp">C++</button>
      </div>

    </div>

    <nav class="landing-legal">
      <a href="impressum.html">Impressum</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
  </div>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <main class="main-content">

    <!-- Quiz view -->
    <div id="quiz-view" class="hidden">

      <div class="starmap-wrap">
        <svg class="starmap-svg" id="starmap-svg" viewBox="0 0 640 56"></svg>
      </div>

      <div class="card" id="question-card">

        <div class="question-meta">
          <span class="difficulty-badge easy" id="difficulty-badge">Easy</span>
          <span class="category-tag" id="category-tag"></span>
          <span class="question-points" id="question-points">100 pts</span>
        </div>
        <p class="question-text" id="question-text"></p>

        <div class="code-window">
          <div class="code-titlebar">
            <div class="dots">
              <span class="dot dot-r"></span>
              <span class="dot dot-y"></span>
              <span class="dot dot-g"></span>
            </div>
            <span class="code-filename" id="code-filename">snippet.py</span>
          </div>
          <pre class="code-body"><code class="language-python" id="code-display"></code></pre>
        </div>

        <div class="choices" id="choices-container"></div>

      </div>

      <div class="card feedback-card hidden" id="feedback-card">

        <div class="feedback-status">
          <span class="status-icon" id="status-icon"></span>
          <span class="status-text"  id="status-text"></span>
        </div>

        <div class="feedback-answer">
          <span class="answer-label">The output is:</span>
          <code class="answer-value" id="correct-answer-display"></code>
        </div>

        <p class="feedback-explanation" id="feedback-explanation"></p>

        <div class="feedback-footer">
          <button class="btn btn-primary" id="next-btn">Next Question &rarr;</button>
        </div>

      </div>

      <!-- End screen — inside quiz-view so the starmap stays visible -->
      <div id="end-view" class="hidden">
        <div class="card end-card">
          <div class="end-trophy">[ COMPLETE ]</div>
          <h2 class="end-title">Quest Complete!</h2>
          <p class="end-subtitle" id="end-subtitle"></p>
          <div class="end-score" id="end-score"></div>
          <div class="end-grade" id="end-grade"></div>
          <div class="end-actions">
            <button class="btn btn-primary" id="restart-btn">Continue Quest &rarr;</button>
          </div>
        </div>
      </div>

    </div><!-- /quiz-view -->

  </main>

  <!-- ── Sidebar ad — fixed, floats right of centered content (≥ 1100px) ── -->
  <aside class="quiz-sidebar" aria-hidden="true">
    <!--
      Carbon Ads — once approved, replace the placeholder div below with:
      <script async type="text/javascript"
        src="//cdn.carbonads.com/carbon.js?serve=CESIXXXX&placement=code-quizpagesdev"
        id="_carbonads_js">
      </script>
    -->
    <div class="carbonads-placeholder">
      <div class="carbonads-stripe">{<span class="carbonads-cq">CQ</span>}</div>
    </div>
  </aside>

  <footer class="site-footer">
    <span class="site-footer-copy">&copy; 2026 Alexander Diestel</span>
    <nav class="site-footer-links">
      <a href="impressum.html">Impressum</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
  </footer>

  <!-- Python questions -->
  <script src="questions/python/lists.js"></script>
  <script src="questions/python/strings.js"></script>
  <script src="questions/python/types.js"></script>
  <script src="questions/python/functions.js"></script>
  <script src="questions/python/memory.js"></script>
  <script src="questions/python/boss.js"></script>
  <!-- C++ questions -->
  <script src="questions/cpp/output.js"></script>
  <script src="questions/cpp/types.js"></script>
  <script src="questions/cpp/pointers.js"></script>
  <script src="questions/cpp/control.js"></script>
  <script src="questions/cpp/boss.js"></script>
  <!-- Language registry (must be last) -->
  <script src="questions/catalogue.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
